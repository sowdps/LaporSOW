<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Form Order Kendala Teknisi</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div class="form-container">

        <div class="sow-brand-header">

            <img class="sow-brand-logo" src="images/logo-sow-iv-dps-compact.png" alt="Logo SOW IV DPS">

        </div>

        <h1 class="sow-form-title">
            LAPOR SOW
        </h1>
        <p class="sow-form-subtitle">
            Sistem Laporan dan Permintaan Teknisi IT
        </p>
        <form id="orderForm">

            <div class="form-group">

                <label for="nama">NAMA</label>

                <input type="text" id="nama" required placeholder="Nama Lengkap">

            </div>


            <div class="form-group">

                <label for="nip">NIP</label>

                <input type="text" id="nip" required placeholder="Nomor Induk Pegawai">

            </div>


            <div class="form-group">

                <label for="kode_cabang">KODE CABANG</label>

                <select id="kode_cabang" required>

                    <option value="">Pilih Cabang</option>

                </select>

            </div>


            <div class="form-group">

                <label for="jenis_kendala">JENIS KENDALA</label>

                <select id="jenis_kendala" required>

                    <option value="">Pilih Jenis Kendala</option>
                </select>

            </div>


            <div class="form-group">

                <label for="deskripsi">DESKRIPSI</label>

                <textarea id="deskripsi" required placeholder="Jelaskan detail kendala..."></textarea>

            </div>


            <div class="form-group">

                <label for="whatsapp">WHATSAPP</label>

                <input type="tel" id="whatsapp" required placeholder="08123456789">

            </div>


            <div class="form-group">

                <label for="tanggal">TANGGAL</label>

                <input type="date" id="tanggal" required>


                <label for="jam" class="label-jam">

                    JAM

                </label>

                <input type="time" id="jam" required>

            </div>


            <div class="form-group">

                <label>KODE ORDER</label>

                <div id="kode">

                    Memuat...

                </div>

            </div>


            <button type="submit" class="btn-submit" id="submitBtn">

                KIRIM ORDER

            </button>


            <div id="success"></div>

        </form>

    </div>


    <script src="js/script.js"></script>

</body>

</html>
