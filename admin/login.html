<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Login Admin | SOW IV Denpasar
    </title>

    <meta name="description" content="Login Admin Sistem Monitoring Lapor SOW">

    <link rel="stylesheet" href="./login.css">

    <style>
        .sow-login-brand {
            text-align: center;
            margin-bottom: 20px;
        }

        .sow-login-logo {
            width: 100px;
            height: 100px;
            object-fit: contain;
            display: block;
            margin: 0 auto 10px;
        }

        .sow-login-brand-name {
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: #123c68;
            margin: 0;
        }

        .sow-login-brand-subtitle {
            font-size: 9px;
            letter-spacing: 2px;
            color: #68798d;
            margin-top: 5px;
            font-weight: 600;
        }

        .login-subtitle {
            text-align: center;
            color: #68798d;
            font-size: 13px;
            margin-bottom: 22px;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 45px;
        }

        .password-toggle {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            border: 0;
            background: transparent;
            cursor: pointer;
            font-size: 16px;
            color: #5d7188;
        }

        .session-info {
            text-align: center;
            font-size: 11px;
            color: #738398;
            margin-top: 15px;
            line-height: 1.5;
        }

        .login-footer {
            text-align: center;
            margin-top: 18px;
            font-size: 10px;
            color: #91a0b2;
        }
    </style>

</head>


<body>


    <main class="login-container">


        <section class="login-card">


            <!-- ==================================================
           BRAND SOW
           ================================================== -->

            <div class="sow-login-brand">

                <img src="../images/logo-sow-iv-dps-compact.png" alt="Logo SOW IV Denpasar" class="sow-login-logo">

                <div class="sow-login-brand-name">
                    SOW IV DENPASAR
                </div>

                <div class="sow-login-brand-subtitle">
                    SISTEM MONITORING LAPOR SOW
                </div>

            </div>


            <!-- ==================================================
           JUDUL
           ================================================== -->

            <h1 class="login-title">
                🔐 LOGIN ADMIN
            </h1>

            <p class="login-subtitle">
                Masuk ke Dashboard SOW
            </p>


            <!-- ==================================================
           FORM LOGIN
           ================================================== -->

            <form id="loginForm" autocomplete="off">


                <!-- USERNAME -->

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input type="text" id="username" name="username" placeholder="Masukkan username"
                        autocomplete="username" required>

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input type="password" id="password" name="password" placeholder="Masukkan password"
                            autocomplete="current-password" required>

                        <button type="button" id="togglePassword" class="password-toggle"
                            aria-label="Tampilkan password">
                            👁
                        </button>

                    </div>

                </div>


                <!-- TOMBOL LOGIN -->

                <button type="submit" id="loginButton" class="login-button">
                    LOGIN
                </button>


                <!-- PESAN -->

                <div id="pesanLogin" aria-live="polite"></div>


            </form>


            <!-- ==================================================
           INFO SESSION
           ================================================== -->

            <div class="session-info">

                Session admin berlaku maksimal
                <strong>6 jam</strong>
                sejak login.

                <br>

                Tidak ada batas jumlah admin
                yang dapat login bersamaan.

            </div>


            <!-- ==================================================
           FOOTER
           ================================================== -->

            <div class="login-footer">

                Akses Admin SOW IV Denpasar

            </div>


        </section>


    </main>


    <script>

        /* =====================================================
           KONFIGURASI API
           ===================================================== */

        const API_URL =
            "https://script.google.com/macros/s/AKfycbyOcM6jK4OHqHwd7203Do9Za0W23ZpA4wfmvBd2UsqQT_7v359DkjKTxdeaEqjQlqhV/exec";


        /* =====================================================
           ELEMENT
           ===================================================== */

        const loginForm =
            document.getElementById(
                "loginForm"
            );

        const usernameInput =
            document.getElementById(
                "username"
            );

        const passwordInput =
            document.getElementById(
                "password"
            );

        const loginButton =
            document.getElementById(
                "loginButton"
            );

        const pesanLogin =
            document.getElementById(
                "pesanLogin"
            );

        const togglePassword =
            document.getElementById(
                "togglePassword"
            );


        /* =====================================================
           PESAN LOGIN
           ===================================================== */

        function tampilkanPesan(
            message,
            type
        ) {

            pesanLogin.textContent =
                message || "";

            pesanLogin.className =
                type || "";

        }


        /* =====================================================
           TOGGLE PASSWORD
           ===================================================== */

        togglePassword.addEventListener(
            "click",
            function () {

                if (
                    passwordInput.type ===
                    "password"
                ) {

                    passwordInput.type =
                        "text";

                    togglePassword.textContent =
                        "🙈";

                }
                else {

                    passwordInput.type =
                        "password";

                    togglePassword.textContent =
                        "👁";

                }

            }
        );


        /* =====================================================
           LOGIN
           ===================================================== */

        loginForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const username =
                    usernameInput.value.trim();

                const password =
                    passwordInput.value;


                if (
                    !username ||
                    !password
                ) {

                    tampilkanPesan(
                        "Username dan password wajib diisi.",
                        "error"
                    );

                    return;

                }


                loginButton.disabled =
                    true;

                loginButton.textContent =
                    "MEMPROSES...";


                tampilkanPesan(
                    "",
                    ""
                );


                try {

                    const response =
                        await fetch(
                            API_URL,
                            {

                                method:
                                    "POST",

                                headers: {

                                    "Content-Type":
                                        "text/plain;charset=utf-8"

                                },

                                body:
                                    JSON.stringify({

                                        action:
                                            "loginAdmin",

                                        username:
                                            username,

                                        password:
                                            password

                                    })

                            }
                        );


                    const result =
                        await response.json();


                    if (
                        !result.success
                    ) {

                        throw new Error(
                            result.message ||
                            "Login gagal."
                        );

                    }


                    if (
                        !result.token
                    ) {

                        throw new Error(
                            "Token login tidak diterima dari server."
                        );

                    }


                    /* ===============================================
                       SIMPAN SESSION
                       =============================================== */

                    localStorage.setItem(
                        "MY_SOW_ADMIN_TOKEN",
                        result.token
                    );


                    if (
                        result.expiresAt
                    ) {

                        localStorage.setItem(
                            "MY_SOW_ADMIN_EXPIRES_AT",
                            String(
                                result.expiresAt
                            )
                        );

                    }


                    tampilkanPesan(
                        "Login berhasil. Membuka dashboard...",
                        "success"
                    );


                    passwordInput.value =
                        "";


                    setTimeout(
                        function () {

                            window.location.replace(
                                "index.html"
                            );

                        },
                        300
                    );


                }
                catch (error) {

                    console.error(
                        "LOGIN ERROR:",
                        error
                    );


                    tampilkanPesan(
                        error.message ||
                        "Login gagal.",
                        "error"
                    );


                    loginButton.disabled =
                        false;

                    loginButton.textContent =
                        "LOGIN";

                }

            }
        );


        /* =====================================================
           HAPUS SESSION LAMA JIKA SUDAH EXPIRED
           ===================================================== */

        (function cekSessionLama() {

            const expiresAt =
                Number(
                    localStorage.getItem(
                        "MY_SOW_ADMIN_EXPIRES_AT"
                    ) || 0
                );

            if (
                expiresAt &&
                Date.now() >=
                expiresAt
            ) {

                localStorage.removeItem(
                    "MY_SOW_ADMIN_TOKEN"
                );

                localStorage.removeItem(
                    "MY_SOW_ADMIN_EXPIRES_AT"
                );

            }

        })();


        /* =====================================================
           PASSWORD DIKOSONGKAN SAAT KEMBALI KE LOGIN
           ===================================================== */

        window.addEventListener(
            "pageshow",
            function () {

                passwordInput.value =
                    "";

            }
        );

    </script>


</body>

</html>
