<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#17365d">

    <meta name="description" content="Login Admin SOW IV Denpasar">

    <title>Login Admin | SOW IV Denpasar</title>

    <link rel="stylesheet" href="./login.css">

    <style>
        /* =====================================================
           LOGIN ADMIN - PENYEMPURNAAN TAMPILAN
           ===================================================== */

        .sow-login-brand {
            text-align: center;
            margin-bottom: 24px;
        }

        .sow-login-logo {
            display: block;

            width: 125px;
            height: 125px;

            object-fit: contain;

            margin: 0 auto 15px;

            filter:
                drop-shadow(0 8px 15px rgba(0, 0, 0, 0.18));
        }

        .sow-login-brand-name {
            margin: 0;

            color: #17365d;

            font-size: 21px;
            font-weight: 800;

            letter-spacing: 1.4px;
        }

        .sow-login-brand-subtitle {
            margin: 6px 0 0;

            color: #64748b;

            font-size: 11px;
            font-weight: 700;

            letter-spacing: 1.2px;
        }

        .login-title {
            margin-bottom: 22px;

            color: #17365d;

            font-size: 21px;
            font-weight: 800;

            text-align: center;

            letter-spacing: 0.3px;
        }

        .login-form-group {
            margin-bottom: 17px;
        }

        .login-form-group label {
            display: block;

            margin-bottom: 7px;

            color: #334155;

            font-size: 13px;
            font-weight: 700;
        }

        .login-input-wrapper {
            position: relative;
        }

        .login-input-wrapper input {
            width: 100%;

            min-height: 46px;

            padding:
                0 45px 0 13px;

            border:
                1px solid #cbd5e1;

            border-radius: 9px;

            background: #ffffff;

            color: #1e293b;

            font-size: 14px;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .login-input-wrapper input:focus {
            outline: none;

            border-color: #2563eb;

            box-shadow:
                0 0 0 3px rgba(37, 99, 235, 0.10);
        }

        .password-toggle {
            position: absolute;

            top: 50%;
            right: 10px;

            transform:
                translateY(-50%);

            width: 34px;
            height: 34px;

            padding: 0;

            border: none;

            border-radius: 7px;

            background: transparent;

            color: #64748b;

            font-size: 17px;
        }

        .password-toggle:hover {
            background: #f1f5f9;

            color: #17365d;
        }

        #loginButton {
            width: 100%;

            min-height: 47px;

            margin-top: 7px;

            border: none;

            border-radius: 9px;

            background:
                linear-gradient(135deg,
                    #17365d,
                    #2f75b5);

            color: #ffffff;

            font-size: 14px;
            font-weight: 800;

            letter-spacing: 0.5px;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                opacity 0.2s ease;
        }

        #loginButton:hover:not(:disabled) {
            transform:
                translateY(-1px);

            box-shadow:
                0 6px 16px rgba(23, 54, 93, 0.25);
        }

        #loginButton:active:not(:disabled) {
            transform:
                translateY(0);
        }

        #loginButton:disabled {
            cursor: wait;

            opacity: 0.70;
        }

        #pesanLogin {
            min-height: 22px;

            margin-top: 15px;

            font-size: 13px;

            line-height: 1.5;

            text-align: center;
        }

        .login-security-note {
            margin-top: 20px;
            padding-top: 15px;

            border-top:
                1px solid #e2e8f0;

            color: #94a3b8;

            font-size: 11px;

            line-height: 1.5;

            text-align: center;
        }

        .login-security-note strong {
            color: #64748b;
        }

        /* =====================================================
           RESPONSIVE
           ===================================================== */

        @media (max-width: 768px) {

            .sow-login-logo {
                width: 105px;
                height: 105px;

                margin-bottom: 13px;
            }

            .sow-login-brand-name {
                font-size: 18px;
            }

            .sow-login-brand-subtitle {
                font-size: 10px;
            }

            .login-title {
                font-size: 19px;
            }
        }
    </style>
</head>


<body>

    <main class="login-container">

        <section class="login-card" aria-labelledby="loginTitle">

            <!-- =================================================
                 BRANDING SOW
                 ================================================= -->

            <div class="sow-login-brand">

                <img class="sow-login-logo" src="../images/logo-sow-iv-dps-compact.png" alt="Logo SOW IV Denpasar"
                    loading="eager">

                <p class="sow-login-brand-subtitle">
                    SISTEM MONITORING LAPOR SOW
                </p>

            </div>


            <!-- =================================================
                 JUDUL LOGIN
                 ================================================= -->

            <div class="login-title" id="loginTitle">
                 🔐LOGIN ADMIN
            </div>


            <!-- =================================================
                 FORM LOGIN
                 ================================================= -->

            <form id="loginForm" autocomplete="on" novalidate>

                <!-- USERNAME -->

                <div class="login-form-group">

                    <label for="username">
                        Username
                    </label>

                    <div class="login-input-wrapper">

                        <input type="text" id="username" name="username" autocomplete="username"
                            placeholder="Masukkan username" maxlength="50" required>

                    </div>

                </div>


                <!-- PASSWORD -->

                <div class="login-form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="login-input-wrapper">

                        <input type="password" id="password" name="password" autocomplete="current-password"
                            placeholder="Masukkan password" maxlength="100" required>

                        <button type="button" class="password-toggle" id="passwordToggle"
                            aria-label="Tampilkan password" title="Tampilkan password">
                            👁
                        </button>

                    </div>

                </div>


                <!-- LOGIN -->

                <button type="submit" id="loginButton">
                    LOGIN
                </button>

            </form>


            <!-- =================================================
                 PESAN LOGIN
                 ================================================= -->

            <div id="pesanLogin" role="alert" aria-live="polite"></div>


            <!-- =================================================
                 INFORMASI KEAMANAN
                 ================================================= -->

            <div class="login-security-note">

                <strong>Akses Admin</strong><br>

                Gunakan akun admin yang telah terdaftar.
                Jangan membagikan password kepada pihak lain.

            </div>

        </section>

    </main>


    <script>

        /* =====================================================
           MY SOW BALI
           LOGIN ADMIN
           ===================================================== */


        /* =====================================================
           01. KONFIGURASI API
           ===================================================== */

        const API_URL =
            "https://script.google.com/macros/s/AKfycbyOcM6jK4OHqHwd7203Do9Za0W23ZpA4wfmvBd2UsqQT_7v359DkjKTxdeaEqjQlqhV/exec";


        /* =====================================================
           02. ELEMENT HTML
           ===================================================== */

        const loginForm =
            document.getElementById("loginForm");

        const usernameInput =
            document.getElementById("username");

        const passwordInput =
            document.getElementById("password");

        const loginButton =
            document.getElementById("loginButton");

        const pesanLogin =
            document.getElementById("pesanLogin");

        const passwordToggle =
            document.getElementById("passwordToggle");


        /* =====================================================
           03. CEK ELEMENT
           ===================================================== */

        if (
            !loginForm ||
            !usernameInput ||
            !passwordInput ||
            !loginButton ||
            !pesanLogin
        ) {

            console.error(
                "Element login tidak lengkap."
            );

        }


        /* =====================================================
           04. TAMPILKAN / SEMBUNYIKAN PASSWORD
           ===================================================== */

        if (passwordToggle) {

            passwordToggle.addEventListener(
                "click",
                function () {

                    const sedangPassword =
                        passwordInput.type === "password";

                    passwordInput.type =
                        sedangPassword
                            ? "text"
                            : "password";

                    passwordToggle.textContent =
                        sedangPassword
                            ? "🙈"
                            : "👁";

                    passwordToggle.setAttribute(
                        "aria-label",
                        sedangPassword
                            ? "Sembunyikan password"
                            : "Tampilkan password"
                    );

                    passwordToggle.setAttribute(
                        "title",
                        sedangPassword
                            ? "Sembunyikan password"
                            : "Tampilkan password"
                    );

                }
            );

        }


        /* =====================================================
           05. FUNGSI PESAN LOGIN
           ===================================================== */

        function tampilkanPesanLogin(
            pesan,
            tipe = "info"
        ) {

            if (!pesanLogin) {
                return;
            }

            pesanLogin.textContent = pesan;

            if (tipe === "success") {

                pesanLogin.style.color =
                    "#16a34a";

            } else if (tipe === "error") {

                pesanLogin.style.color =
                    "#dc2626";

            } else {

                pesanLogin.style.color =
                    "#64748b";

            }

        }


        /* =====================================================
           06. BERSIHKAN PASSWORD
           ===================================================== */

        function kosongkanPassword() {

            if (!passwordInput) {
                return;
            }

            passwordInput.value = "";

        }


        /* =====================================================
           07. CEK SESSION ADMIN LAMA
           ===================================================== */

        function cekSessionLama() {

            const tokenLama =
                localStorage.getItem(
                    "MY_SOW_ADMIN_TOKEN"
                );

            if (tokenLama) {

                /*
                 * Token lama sengaja tidak langsung
                 * mengarahkan user ke dashboard.
                 *
                 * Validasi session dilakukan oleh
                 * admin.js saat dashboard dibuka.
                 */

                console.log(
                    "Session admin ditemukan."
                );

            }

        }


        /* =====================================================
           08. PROSES LOGIN ADMIN
           ===================================================== */

        loginForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const username =
                    usernameInput.value.trim();

                const password =
                    passwordInput.value;


                /* ---------------------------------------------
                   VALIDASI INPUT
                   --------------------------------------------- */

                if (!username) {

                    tampilkanPesanLogin(
                        "Username wajib diisi.",
                        "error"
                    );

                    usernameInput.focus();

                    return;

                }


                if (!password) {

                    tampilkanPesanLogin(
                        "Password wajib diisi.",
                        "error"
                    );

                    passwordInput.focus();

                    return;

                }


                /* ---------------------------------------------
                   LOCK TOMBOL LOGIN
                   --------------------------------------------- */

                loginButton.disabled = true;

                loginButton.textContent =
                    "MEMERIKSA...";

                tampilkanPesanLogin(
                    "Menghubungkan ke server...",
                    "info"
                );


                try {

                    /* -----------------------------------------
                       REQUEST LOGIN KE APPS SCRIPT
                       ----------------------------------------- */

                    const response =
                        await fetch(
                            API_URL,
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "text/plain;charset=utf-8"
                                },

                                body:
                                    JSON.stringify({
                                        action:
                                            "loginAdmin",

                                        username:
                                            username,

                                        password:
                                            password
                                    })
                            }
                        );


                    /* -----------------------------------------
                       BACA RESPONSE
                       ----------------------------------------- */

                    const text =
                        await response.text();

                    let result;

                    try {

                        result =
                            JSON.parse(text);

                    } catch (jsonError) {

                        console.error(
                            "Response server:",
                            text
                        );

                        throw new Error(
                            "Server mengirim respon yang tidak valid."
                        );

                    }


                    /* -----------------------------------------
                       LOGIN GAGAL
                       ----------------------------------------- */

                    if (!result.success) {

                        throw new Error(
                            result.message ||
                            "Username atau password salah."
                        );

                    }


                    /* -----------------------------------------
                       TOKEN TIDAK ADA
                       ----------------------------------------- */

                    if (!result.token) {

                        throw new Error(
                            "Login berhasil tetapi token tidak diterima."
                        );

                    }


                    /* -----------------------------------------
                       SIMPAN TOKEN ADMIN
                       ----------------------------------------- */

                    localStorage.setItem(
                        "MY_SOW_ADMIN_TOKEN",
                        result.token
                    );


                    /* -----------------------------------------
                       PESAN BERHASIL
                       ----------------------------------------- */

                    tampilkanPesanLogin(
                        "Login berhasil. Membuka dashboard...",
                        "success"
                    );


                    /* -----------------------------------------
                       BERSIHKAN PASSWORD
                       ----------------------------------------- */

                    kosongkanPassword();


                    /* -----------------------------------------
                       MASUK DASHBOARD
                       ----------------------------------------- */

                    setTimeout(
                        function () {

                            window.location.replace(
                                "index.html"
                            );

                        },
                        350
                    );

                }


                /* =================================================
                   ERROR HANDLER
                   ================================================= */

                catch (error) {

                    console.error(
                        "ERROR LOGIN:",
                        error
                    );

                    tampilkanPesanLogin(
                        error.message ||
                        "Login gagal. Silakan coba lagi.",
                        "error"
                    );

                }


                /* =================================================
                   AKTIFKAN KEMBALI TOMBOL
                   ================================================= */

                finally {

                    loginButton.disabled =
                        false;

                    loginButton.textContent =
                        "LOGIN";

                }

            }
        );


        /* =====================================================
           09. BERSIHKAN PASSWORD SAAT HALAMAN DIBUKA
           ===================================================== */

        kosongkanPassword();


        /* =====================================================
           10. BERSIHKAN PASSWORD SAAT KEMBALI KE LOGIN
           ===================================================== */

        window.addEventListener(
            "pageshow",
            function () {

                kosongkanPassword();

            }
        );


        /* =====================================================
           11. INISIALISASI
           ===================================================== */

        cekSessionLama();

    </script>

</body>

</html>
